name: MobilePhoneProxy
options:
  bundleIdPrefix: com.stepanic
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: ""              # fill in your Apple Developer team ID
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1,2"     # iPhone + iPad

targets:
  MobilePhoneProxy:
    type: application
    platform: iOS
    sources:
      - path: MobilePhoneProxy
    info:
      path: MobilePhoneProxy/Info.plist
      properties:
        CFBundleDisplayName: Mobile Phone Proxy
        # iOS re-indexes App Intents (Shortcuts actions) only when the build
        # number changes — bump CURRENT_PROJECT_VERSION for every device build.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIRequiresFullScreen: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        # Required when binding NWListener on local network in iOS 14+.
        NSLocalNetworkUsageDescription: >-
          Used to expose an HTTP proxy to other devices on your WiFi so they can
          tunnel traffic through this phone's cellular connection.
        # Required by iOS 14+ for the local-network permission flow to work
        # cleanly with NWListener. We don't actually advertise Bonjour, but
        # declaring at least one service type is the documented requirement.
        NSBonjourServices:
          - _mobilephoneproxy._tcp
        # Optional: declare we will use cellular when WiFi is also available.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        # Callback scheme for the "Rotate IP" shortcut (x-success / x-error).
        CFBundleURLTypes:
          - CFBundleURLName: com.stepanic.mobilephoneproxy
            CFBundleURLSchemes:
              - mobilephoneproxy
        # `audio` lets the silent-audio keepalive (BackgroundAudioKeepAlive) hold
        # the process — and thus the NWListener — alive with the screen locked.
        # `processing` alone only buys a short grace period for TCP listeners.
        # Relay Worker (relay/) that forwards signed rotate commands from the cloud.
        MPPRelayURL: https://mpp-relay.d-o-m.workers.dev
        MPPRelayPhoneID: $(MPP_RELAY_PHONE_ID)
        UIBackgroundModes:
          - audio
          - processing
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.stepanic.mobilephoneproxy
        MARKETING_VERSION: "1.1"
        CURRENT_PROJECT_VERSION: "5"
        MPP_RELAY_PHONE_ID: iphone
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
